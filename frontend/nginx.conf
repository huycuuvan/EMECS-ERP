server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 12m;   # ảnh phiếu tối đa 10MB

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # thông báo realtime (SSE): không đệm, giữ kết nối lâu
    location /api/notifications/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location /health { proxy_pass http://backend:8000; }

    # file build có hash → cache lâu; index.html không cache để cập nhật bản mới ngay
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    # service worker + manifest luôn lấy bản mới
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; default_type application/manifest+json; try_files $uri =404; }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
